# Start:  ./start.sh  (Windows: .\start.ps1)  - agent + Grafana on http://localhost:3000
#
# Your .env keeps the real values. The image build turns it into an encrypted keystore plus a .env in the image
# where each secret is a reference (HF_TOKEN=keystore:HF_TOKEN). .env and the password reach the build as build
# secrets (never stored in a layer); at runtime the password is a Docker secret, mounted at /run/secrets/.
# The password is in ./keystore_password: start.sh creates it with a placeholder that you replace (never committed).
secrets:
  dotenv:            { file: ./.env }
  keystore_password: { file: ./keystore_password }

services:
  email-agent:
    build:
      context: .
      target: runtime
      secrets: [dotenv, keystore_password]
      args: { CONFIG_HASH: "${CONFIG_HASH:-none}" }  # start.sh: changes with .env, so the keystore is rebuilt
    secrets: [keystore_password]
    environment:
      OTEL_TRACES_EXPORTER: otlp                          # traces, metrics and logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Raw LLM prompts/replies (customer email text!) in Tempo and Loki. Set false in .env to stop.
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-true}
    volumes:
      - ./output:/app/output  # the only writable path
    # Keeps running: the mailbox from .env (IMAP_USERNAME set) or else the mock inbox. On new mail (IMAP IDLE)
    # it labels emails, sends clean replies and saves the rest as drafts.
    # One-off run instead: docker compose run --rm email-agent --limit 5
    command: ["--watch", "--limit", "${MAIL_LIMIT:-20}", "--interval", "${WATCH_INTERVAL:-1500}"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [otel-collector]

  # ---- Observability: agent -> Collector -> Tempo (traces) / Loki (logs) / Prometheus (metrics) -> Grafana
  # Only Grafana is published (localhost:3000); everything else stays on the internal network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=7d", "--web.enable-otlp-receiver"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # Local demo login admin/password (Grafana is only published on 127.0.0.1). Override in .env.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/email-agent.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # Grafana, this machine only (login: admin / password)
    restart: unless-stopped
    depends_on: [tempo, loki, prometheus]

  tests:
    build: { context: ., target: test }
    profiles: ["test"]

  # Evals: the real agent and LLM on data/eval_set.json (see README, "Evals"). Never sends mail or saves drafts.
  #   docker compose run --rm evals [--judge] [--max-calls 15]
  # No OTEL exporter on purpose: eval runs must not show up as real emails on the dashboard.
  evals:
    build:
      context: .
      target: evals
      secrets: [dotenv, keystore_password]
      args: { CONFIG_HASH: "${CONFIG_HASH:-none}" }
    profiles: ["evals"]
    secrets: [keystore_password]
    volumes:
      - ./output:/app/output  # LLM reply cache and reports in ./output/evals
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
