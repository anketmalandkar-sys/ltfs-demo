# Start:  docker compose up -d   (agent + Grafana on http://localhost:3000)
# Secrets are files in ./secrets/ (gemini_api_key, imap_password, ...), mounted read-only at /run/secrets/
# and never put in environment variables (those show up in `docker inspect`). Create only the ones you use.
# Everything else (MAIL_PROFILE, IMAP_USERNAME, limits) is read from .env.

services:
  email-agent:
    build: { context: ., target: runtime }
    env_file:  # non-secret settings only
      - path: .env
        required: false
    environment:
      OTEL_TRACES_EXPORTER: otlp                          # traces, metrics and logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Raw LLM prompts/replies (customer email text!) in Tempo and Loki. Set false in .env to stop.
      OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-true}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./output:/app/output  # the only writable path
    # Keeps running: the mailbox from .env (IMAP_USERNAME set) or else the mock inbox. On new mail (IMAP IDLE)
    # it labels emails, sends clean replies and saves the rest as drafts.
    # One-off run instead: docker compose run --rm email-agent --limit 5
    command: ["--watch", "--limit", "${MAIL_LIMIT:-20}", "--interval", "${WATCH_INTERVAL:-1500}"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [otel-collector]

  # ---- Observability: agent -> Collector -> Tempo (traces) / Loki (logs) / Prometheus (metrics) -> Grafana
  # Only Grafana is published (localhost:3000); everything else stays on the internal network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    depends_on: [tempo, loki, prometheus]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=7d", "--web.enable-otlp-receiver"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # Local demo login admin/password (Grafana is only published on 127.0.0.1). Override in .env.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/email-agent.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # Grafana, this machine only (login: admin / password)
    restart: unless-stopped
    depends_on: [tempo, loki, prometheus]

  tests:
    build: { context: ., target: test }
    profiles: ["test"]

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
